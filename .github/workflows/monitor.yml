name: Sentinel Uptime Checks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare state directory
        run: mkdir -p .sentinel-state

      - name: Restore previous monitor state
        uses: actions/cache/restore@v4
        with:
          path: .sentinel-state/state.json
          key: sentinel-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sentinel-state-

      - name: Run checks and send Discord alerts
        id: checks
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py --once

      - name: Save monitor state for the next scheduled run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sentinel-state/state.json
          key: sentinel-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mark the workflow failed if any site check failed
        if: steps.checks.outcome == 'failure'
        run: |
          echo "At least one monitored site failed its check. See the monitor step and Discord for details."
          exit 1
