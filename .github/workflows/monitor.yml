name: Sentinel Uptime Checks

# Checks the sites in the SENTINEL_CONFIG secret every 5 minutes, sends alerts,
# and publishes status.json + state.json to the "status-data" branch so the
# website can show live results and the next run remembers what happened.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore previous state
        run: |
          mkdir -p .sentinel-state
          if git fetch --depth=1 origin status-data 2>/dev/null; then
            git show FETCH_HEAD:state.json > .sentinel-state/state.json || rm -f .sentinel-state/state.json
          else
            echo "No previous state yet (first run)."
          fi

      - name: Run checks and send alerts
        env:
          SENTINEL_STATE_DIR: .sentinel-state
          SENTINEL_CONFIG: ${{ secrets.SENTINEL_CONFIG }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          code=0
          python monitor.py --once || code=$?
          # 1 means a site is failing (already alerted). 2 means a configuration error.
          if [ "$code" -ge 2 ]; then exit "$code"; fi

      - name: Publish status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f .sentinel-state/status.json || { echo "No status produced; skipping publish."; exit 0; }
          mkdir -p /tmp/publish/docs
          cp .sentinel-state/state.json .sentinel-state/status.json /tmp/publish/
          # Keeps Vercel from building this data branch (see README).
          echo '{"git":{"deploymentEnabled":false}}' | tee /tmp/publish/vercel.json > /tmp/publish/docs/vercel.json
          echo "Data branch written by the Sentinel workflow. Not a website." > /tmp/publish/README.md
          cd /tmp/publish
          git init -q -b status-data
          git config user.name "sentinel-bot"
          git config user.email "sentinel-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Sentinel status $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status-data
