# Sentinel configuration for Judea's deployed projects.
# Keep DISCORD_WEBHOOK_URL in GitHub Actions Secrets, never in this file.

settings:
  interval: 300
  timeout: 20
  retries: 1
  failure_threshold: 2
  workers: 4
  ssl_warn_days: 14
  log_file: .sentinel-state/uptime.log
  state_file: .sentinel-state/state.json
  status_file: .sentinel-state/status.json

sites:
  - name: Wine About It
    url: https://wine-about-it.vercel.app/
    expected_status: [200]
    timeout: 20

  - name: Judea Portfolio
    url: https://judeatablate.vercel.app/
    expected_status: [200]
    timeout: 20

  - name: SplitBill
    url: https://splitbill-5ulc.onrender.com/
    expected_status: [200]
    # Render may take longer to respond if the service has been idle.
    timeout: 60

  - name: Second Sense
    url: https://second-sense-frontend.vercel.app/
    expected_status: [200]
    timeout: 20
