# Example Sentinel configuration. Copy it, list your own sites, then run:
#   python monitor.py
#
# For hosted setups, put your whole site list in a SENTINEL_CONFIG secret instead
# of committing it here (see the README). Alert credentials never go in this file.

settings:
  interval: 60            # seconds between check cycles
  timeout: 10             # seconds before a request counts as failed
  retries: 1              # extra attempts before a check counts as failed
  failure_threshold: 2    # consecutive failed checks before a DOWN alert
  workers: 8              # sites checked in parallel
  ssl_warn_days: 14       # warn when a certificate expires within N days

sites:
  - name: Example site
    url: https://example.com

  # More options per site:
  # - name: My API
  #   url: https://api.example.com/health
  #   expected_status: [200, 204]   # accepted status codes (default: 200)
  #   timeout: 5                    # overrides settings.timeout
  #   keyword: '"status":"ok"'      # response body must contain this text
