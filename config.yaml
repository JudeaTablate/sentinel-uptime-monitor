# Sentinel configuration
# Secrets (the Discord webhook) do NOT belong here. Set DISCORD_WEBHOOK_URL
# in your environment or in a local .env file instead.

settings:
  interval: 60            # seconds between check cycles
  timeout: 10             # seconds before a request is considered failed
  retries: 1              # extra attempts before a check counts as failed
  failure_threshold: 2    # consecutive failed checks before a DOWN alert
  workers: 8              # sites checked in parallel
  ssl_warn_days: 14       # alert when a certificate expires within N days
  log_file: uptime.log
  state_file: state.json
  status_file: status.json

sites:
  - name: Google
    url: https://www.google.com

  - name: GitHub
    url: https://github.com
    expected_status: [200]

  # More options per site:
  # - name: My API
  #   url: https://api.example.com/health
  #   expected_status: [200, 204]   # accepted status codes
  #   timeout: 5                    # overrides settings.timeout
  #   keyword: '"status":"ok"'      # response body must contain this text
